services:
  wireguard-client:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: tracker-wireguard-client
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Amsterdam
    volumes:
      - ./wireguard-client:/config
      - /lib/modules:/lib/modules:ro

  tracker-test:
    image: ghcr.io/tinlas03-2025-vt/tracking-module:latest
    container_name: tracking-module-test
    restart: "no"
    network_mode: service:wireguard-client
    depends_on:
      - wireguard-client
    volumes:
      - ./cyclonedds:/cyclonedds:ro
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///cyclonedds/client.xml
      - SELF_TEST_COUNT=0
    command: >
      bash -lc "
      source /opt/ros/humble/setup.bash &&
      until [ -e /sys/class/net/wg0 ] && ip addr show wg0 | grep -q 'inet 10.13.13.' && ip route get 10.13.13.1 >/dev/null 2>&1; do
        echo 'waiting for contained wg0 and route to 10.13.13.1...';
        sleep 1;
      done;
      echo 'tracker-test contained wg0 ready';
      ip addr show wg0;
      python3 src/ros_self_test.py"
